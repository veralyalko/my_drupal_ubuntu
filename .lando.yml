name: wcmt
recipe: drupal10

config:
  webroot: web
  php: "8.3"
  via: nginx
  database: postgres:16
  config:
    php: ./php.ini

services:
  appserver:
    build_as_root:
      - apt-get update && apt-get install -y wget curl ca-certificates gnupg lsb-release software-properties-common
      - echo "deb [signed-by=/usr/share/keyrings/postgres.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list
      - wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor > /usr/share/keyrings/postgres.gpg
      - apt-get update && apt-get install -y postgresql-client-16
      - mkdir -p /usr/local/share/ca-certificates/custom
      - cp /app/certs/*.crt /usr/local/share/ca-certificates/custom/
      - update-ca-certificates
      - cp /app/certs/MenloSecurityRootH1.crt /etc/ssl/certs/MenloSecurityRootH1.pem
      - c_rehash /etc/ssl/certs
      - cat /etc/ssl/certs/MenloSecurityRootH1.pem >> /etc/ssl/certs/ca-certificates.crt

    overrides:
      environment:
        PHP_MEMORY_LIMIT: "512M"
        XDEBUG_MODE: debug
        XDEBUG_START_WITH_REQUEST: yes
        XDEBUG_CLIENT_HOST: host.docker.internal
        XDEBUG_CLIENT_PORT: 9003
    ssl: true
    xdebug: true
    composer_version: 2.8.8
    tooling:
      init:
        service: appserver
        description: Run custom init script
        cmd: /app/php-ubuntu/init.sh

  database:
    type: postgres:16
    portforward: true
    overrides:
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: drupal10
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]

  adminer:
    type: compose
    services:
      image: dehy/adminer
      platform: linux/amd64
      command: /bin/s6-svscan /etc/services.d
    portforward: true

  pgadmin:
    type: compose
    app_mount: false
    services:
      image: dpage/pgadmin4
      command: /entrypoint.sh
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@admin.com
        PGADMIN_DEFAULT_PASSWORD: root
      ports:
        - "127.0.0.1::80"
      volumes:
        - ./pgadmin/servers.json:/pgadmin4/servers.json
        - pgadmin_data:/var/lib/pgadmin
      depends_on:
        - database

  mailhog:
    type: mailhog
    hogfrom:
      - appserver
    portforward: true
    overrides:
      platform: linux/amd64

proxy:
  adminer:
    - adminer.wcmt.lndo.site
  mailhog:
    - mail.wcmt.lndo.site
  pgadmin:
    - pgadmin.wcmt.lndo.site

volumes:
  pgadmin_data:

tooling:
  drush:
    service: appserver
    cmd: ./vendor/bin/drush

  phpunit:
    service: appserver
    cmd: ./vendor/bin/phpunit

  xoff:
    cmd: |
      sed -i 's/^zend_extension=xdebug.so/;zend_extension=xdebug.so/' /app/php.ini && kill -USR2 1
    description: Disable xdebug.
    service: appserver
    user: root

  xon:
    cmd: |
      sed -i 's/^;zend_extension=xdebug.so/zend_extension=xdebug.so/' /app/php.ini && kill -USR2 1
    description: Enable xdebug.
    service: appserver
    user: root

  bup:
    service: appserver
    description: Branch update (composer, db updates, config).
    cmd:
      - composer install
      - drush cr
      - drush updb
      - drush cim -y
      - drush cr

  export-db:
    service: appserver
    cmd: >
      bash -c '
        BACKUP_DIR="/app";
        TIMESTAMP=$(date +"%Y-%m-%dT%H-%M-%S");
        FILENAME="backup-${TIMESTAMP}.sql.gz";
        echo "Exporting full PostgreSQL database to $BACKUP_DIR/$FILENAME...";
        PGPASSWORD=postgres pg_dump -U postgres -h database -d drupal10 --no-owner --no-acl --encoding=UTF8 --clean --if-exists --format=plain | gzip > "$BACKUP_DIR/$FILENAME";
        echo "Export complete: $BACKUP_DIR/$FILENAME"
      '

  import-db:
    service: appserver
    cmd: >
      bash -c '
        read -p "Enter full path to SQL file (e.g., ./db/backup.sql or ./db/backup.sql.gz): " SQL_PATH;
        if [ -z "$SQL_PATH" ]; then echo "You must provide a path."; exit 1; fi;
        if [ ! -f "$SQL_PATH" ]; then echo "File not found: $SQL_PATH"; exit 1; fi;
        echo "Importing $SQL_PATH into PostgreSQL...";
        if [[ "$SQL_PATH" == *.gz ]]; then gunzip -c "$SQL_PATH" | PGPASSWORD=postgres psql -U postgres -h database -d drupal10; else cat "$SQL_PATH" | PGPASSWORD=postgres psql -U postgres -h database -d drupal10; fi;
        echo "Import complete."
      '
  export-roles:
    service: appserver
    cmd: >
      bash -c '
        BACKUP_DIR="/app";
        TIMESTAMP=$(date +"%Y-%m-%dT%H-%M-%S");
        ROLE_FILE="roles-${TIMESTAMP}.sql";
        echo "Exporting roles to $BACKUP_DIR/$ROLE_FILE...";
        PGPASSWORD=postgres pg_dumpall -U postgres -h database --roles-only > "$BACKUP_DIR/$ROLE_FILE";
        echo "Role export complete: $BACKUP_DIR/$ROLE_FILE"
      '

  import-roles:
    service: appserver
    cmd: >
      bash -c '
        read -p "Enter full path to ROLES SQL file (e.g., ./db/roles.sql): " ROLES_PATH;
        if [ -z "$ROLES_PATH" ]; then echo "You must provide a path."; exit 1; fi;
        if [ ! -f "$ROLES_PATH" ]; then echo "File not found: $ROLES_PATH"; exit 1; fi;
        echo "Importing roles from $ROLES_PATH...";
        grep -v "CREATE ROLE postgres" "$ROLES_PATH" | PGPASSWORD=postgres psql -U postgres -h database;
        echo "Roles import complete."
      '

          echo "Roles import complete."
      ' 

  export-full-db:
    service: appserver
    cmd: >
      bash -c '
        BACKUP_DIR="/app";
        TIMESTAMP=$(date +"%Y-%m-%dT%H-%M-%S");
        FILENAME="full-backup-${TIMESTAMP}.sql.gz";
        echo "Exporting full PostgreSQL roles + all databases to $BACKUP_DIR/$FILENAME...";
        PGPASSWORD=postgres pg_dumpall -U postgres -h database --no-role-passwords | gzip > "$BACKUP_DIR/$FILENAME";
        echo "Full export complete: $BACKUP_DIR/$FILENAME"
      '

  import-full-db:
    service: appserver
    cmd: >
      bash -c '
        read -p "Enter full path to FULL SQL file (e.g., ./db/full.sql or ./db/full.sql.gz): " SQL_PATH;
        if [ -z "$SQL_PATH" ]; then echo "You must provide a path."; exit 1; fi;
        if [ ! -f "$SQL_PATH" ]; then echo "File not found: $SQL_PATH"; exit 1; fi;
        echo "Importing full PostgreSQL dump (roles + databases)...";
        if [[ "$SQL_PATH" == *.gz ]]; then gunzip -c "$SQL_PATH" | PGPASSWORD=postgres psql -U postgres -h database;
        else cat "$SQL_PATH" | PGPASSWORD=postgres psql -U postgres -h database; fi;
        echo "Full import complete."
      '
